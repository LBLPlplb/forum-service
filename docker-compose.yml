services:
  view:
    image: eddfish/accounting:latest
    container_name: accounting
    ports:
      - "80:80"
    depends_on:
      - forum-service
  forum-service:
    image: eddfish/forum-service:latest
    container_name: forum
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      - PORT=8080
      - DB_NAME=java62
      - MONGO_URI=mongodb://mongodb:27017/java62
  mongodb:
    image: mongo:8.0.6
    ports:
      - "27017:27017"